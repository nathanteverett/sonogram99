[package]
name = "sonograph99"
version = "0.1.0"
edition = "2021"
description = "A late-90s style music visualizer that listens to whatever your computer is playing."
license = "MIT"
publish = false

[workspace]
members = ["core", "wasm", "gpu"]

[dependencies]
cpal = "0.18.2"
minifb = "0.29.0"
sonograph-core = { path = "core" }
sonograph-gpu = { path = "gpu" }

[target.'cfg(windows)'.dependencies]
# Same major version as cpal's own `windows` dependency, so the crate builds once.
windows = { version = "0.62.2", features = ["Foundation", "Media_Control", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi"] }

[profile.dev]
# Keep the software fallback and CPU geometry responsive in development builds.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
